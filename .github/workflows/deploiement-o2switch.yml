# Copie de secours du site et serveur du journal sur O2switch, à chaque push (après les tests).
# Secrets du dépôt (Settings > Secrets and variables > Actions) : FTP_SERVEUR, FTP_UTILISATEUR,
# FTP_MOT_DE_PASSE. Variables facultatives : DOSSIER_SITE (détecté sinon), DOSSIER_MAJ (« learnspace-maj » :
# dépôt de app.js, liste-blanche.json et installer-maj.sh pour le serveur du journal) (chemins depuis la racine
# du compte FTP), DEPLOIEMENT_O2SWITCH = "non" pour couper. Voir docs/DEPLOIEMENT_O2SWITCH.md.
# Jamais envoyés : config.json et les données du serveur (ils ne sont pas dans le dépôt).
name: Déploiement O2switch

on:
  push:
    branches: [claude/ecstatic-gates-507okj, main]
  workflow_dispatch:

concurrency:
  group: deploiement-o2switch
  cancel-in-progress: false

jobs:
  deployer:
    if: ${{ vars.DEPLOIEMENT_O2SWITCH != 'non' }}
    runs-on: ubuntu-latest
    env:
      FTP_SERVEUR: ${{ secrets.FTP_SERVEUR }}
      FTP_UTILISATEUR: ${{ secrets.FTP_UTILISATEUR }}
      LFTP_PASSWORD: ${{ secrets.FTP_MOT_DE_PASSE }}
      # Vides par défaut : détectés à la connexion (voir l'étape d'envoi). Une variable du dépôt les impose.
      DOSSIER_SITE: ${{ vars.DOSSIER_SITE || '' }}
      DOSSIER_MAJ: ${{ vars.DOSSIER_MAJ || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tests
        run: node --test tests/*.test.js
      - name: Secrets présents ?
        id: secrets
        run: |
          if [ -z "$FTP_SERVEUR" ] || [ -z "$FTP_UTILISATEUR" ] || [ -z "$LFTP_PASSWORD" ]; then
            echo "::warning::Secrets FTP absents : pas de déploiement O2switch."
            echo "pret=non" >> "$GITHUB_OUTPUT"
          else
            echo "pret=oui" >> "$GITHUB_OUTPUT"
          fi
      - name: Fichiers publics du site
        if: steps.secrets.outputs.pret == 'oui'
        run: node outils/site-public.js && rm -f _site/_headers
      - name: Installer lftp
        if: steps.secrets.outputs.pret == 'oui'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp
      - name: Envoyer sur O2switch (FTPS)
        if: steps.secrets.outputs.pret == 'oui'
        run: |
          REGLAGES='set ftp:ssl-force true; set ftp:ssl-protect-data true; set ssl:verify-certificate true; set ssl:verify-certificate/${{ vars.FTP_EMPREINTE || '56:68:82:B3:41:72:7C:0E:F8:D7:81:35:CF:D8:2D:3B:1D:29:2C:56' }} no; set net:max-retries 3; set net:timeout 30'
          # Détection des dossiers d'après ce que voit le compte FTP (noms seulement) :
          # - compte ouvert dans le dossier du site : manifest.webmanifest à la racine ;
          # - compte ouvert sur le dossier personnel : learningspace223.duckdns.org/ et learnspace-journal/.
          RACINE=$(lftp -c "$REGLAGES; open --env-password -u \"$FTP_UTILISATEUR\" \"$FTP_SERVEUR\"; cls -1")
          echo "Racine du compte FTP :"; echo "$RACINE"
          if [ -z "$DOSSIER_SITE" ]; then
            if echo "$RACINE" | grep -qx "manifest.webmanifest"; then DOSSIER_SITE=.
            elif echo "$RACINE" | grep -qx "learningspace223.duckdns.org/"; then DOSSIER_SITE=learningspace223.duckdns.org
            else echo "::error::Dossier du site introuvable depuis ce compte FTP."; exit 1; fi
          fi
          # Serveur du journal : on ne l'écrase pas. app.js et liste-blanche.json sont déposés dans
          # learnspace-maj/ avec installer-maj.sh ; l'utilisateur lance « bash ~/learnspace-maj/installer-maj.sh ».
          DOSSIER_MAJ="${DOSSIER_MAJ:-learnspace-maj}"
          echo "Site : $DOSSIER_SITE ; mise à jour du serveur déposée dans : $DOSSIER_MAJ"
          printf '%s\n' "mkdir -p -f \"$DOSSIER_MAJ\"" "put -O \"$DOSSIER_MAJ\" serveur/.htaccess" \
            "put -O \"$DOSSIER_MAJ\" serveur/installer-maj.sh" "put -O \"$DOSSIER_MAJ\" serveur/app.js" \
            "put -O \"$DOSSIER_MAJ\" serveur/liste-blanche.json" > serveur.lftp
          # Le service worker en dernier, pour qu'un visiteur ne mette jamais en cache un mélange de versions.
          lftp <<LFTP
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate true
          # Le serveur FTP d'O2switch envoie un certificat dont lftp ne connaît pas l'émetteur : on accepte
          # CE certificat-là seulement (empreinte SHA-1 vue le 12/11/2026), tout autre reste refusé.
          # Au renouvellement du certificat, remplacer l'empreinte par celle du message d'erreur.
          set ssl:verify-certificate/${{ vars.FTP_EMPREINTE || '56:68:82:B3:41:72:7C:0E:F8:D7:81:35:CF:D8:2D:3B:1D:29:2C:56' }} no
          set net:max-retries 3
          set net:timeout 30
          open --env-password -u "$FTP_UTILISATEUR" "$FTP_SERVEUR"
          # Toute erreur arrête l'envoi (sinon lftp continue et le travail paraît réussi).
          set cmd:fail-exit yes
          # Garde-fou : le vrai dossier du site contient déjà manifest.webmanifest. S'il manque, le compte
          # FTP ne s'ouvre pas sur le site : on s'arrête sans rien envoyer.
          echo "Vérification : $DOSSIER_SITE/manifest.webmanifest doit exister (sinon, voir docs/DEPLOIEMENT_O2SWITCH.md)."
          cls -1 "$DOSSIER_SITE/manifest.webmanifest"
          mirror -R --verbose=1 --parallel=4 --exclude-glob sw.js --exclude-glob sw-fichiers.js _site "$DOSSIER_SITE"
          put -O "$DOSSIER_SITE" _site/sw-fichiers.js
          put -O "$DOSSIER_SITE" _site/sw.js
          source serveur.lftp
          bye
          LFTP
      - name: Vérifier que le serveur du journal répond
        if: steps.secrets.outputs.pret == 'oui'
        run: |
          for i in 1 2 3 4 5 6; do
            r=$(curl -s --max-time 15 https://learningspace223.duckdns.org/api/sante || true)
            [ "$r" = "ok" ] && echo "Serveur du journal : ok" && exit 0
            sleep 10
          done
          echo "::error::Le serveur du journal ne répond pas après le redémarrage."; exit 1
