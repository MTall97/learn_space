<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Learn Space</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icone.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icones/icone-180.png">
  <meta name="theme-color" content="#2a1a10">
  <link rel="stylesheet" href="assets/css/style.css">
  <script src="assets/js/commun.js"></script>
  <script src="assets/js/pwa.js"></script>
  <script src="assets/js/progression.js"></script>
  <script src="assets/js/jeu.js"></script>
  <script src="contenu/parcours.js"></script>
  <script src="assets/js/niveaux.js"></script>
</head>
<body class="page-accueil">
  <main class="page cahier">
    <section id="tableau" aria-labelledby="titre-reprendre">
      <p class="date" id="date"></p>
      <div id="reprendre"></div>
      <div id="journee" class="journee" aria-label="Ma journée"></div>
    </section>

    <section id="ateliers" class="section" aria-labelledby="titre-ateliers">
      <h2 id="titre-ateliers">Sommaire des ateliers</h2>
      <div class="sommaire-zone">
        <ol id="sommaire" class="sommaire"></ol>
        <div id="lecons" class="lecons" aria-live="polite"></div>
      </div>
    </section>

    <section id="brevets" class="section" aria-labelledby="titre-brevets">
      <h2 id="titre-brevets">Mes brevets <span id="brevets-resume" class="compte-titre"></span></h2>
      <div id="grille-brevets" class="tampons"></div>
    </section>

    <section id="bibliotheque" class="section" aria-labelledby="titre-biblio">
      <h2 id="titre-biblio">Chercher une notion ou un TP</h2>
      <input type="search" id="recherche" placeholder="loi d'Ohm, batterie, PID…" aria-label="Chercher">
      <ul id="resultats" class="resultats"></ul>
    </section>

    <p class="pied">
      Learn Space fonctionne hors ligne. Ta progression reste dans ce navigateur ; le site peut compter des statistiques d'utilisation, sans ton nom ni compte.
      <button class="btn petit secondaire" id="effacer">Effacer ma progression</button>
      <a href="confidentialite.html">Confidentialité et journal d'utilisation</a>
      <span id="installer-app" hidden></span>
    </p>
  </main>
  <div class="bas-de-page" aria-hidden="true"></div>
  <script>
  (async function () {
    const LS = window.LS, J = LS.jeu;
    LS.entete(location.hash === "#brevets" ? "brevets" : location.hash && location.hash !== "#tableau" && location.hash !== "#niveau" ? "ateliers" : "accueil");
    const cartes = [];
    LS.parcours.forEach(d => d.etapes.forEach(e => { if (e.type === "carte") cartes.push(e.id); }));
    await Promise.all(cartes.map(id => LS.charger("contenu/cartes/" + id + ".js").catch(() => null)));

    const avancement = (e, dom) => {
      if (e.type === "carte") { const c = LS.cartes[e.id]; return c ? LS.progressionCarte(c) : { faits: 0, total: 0, ratio: 0 }; }
      return LS.progressionTPStockee(e.id, LS.niveau(dom));
    };
    const nomNiveau = n => LS.infoNiveau(n).nom.toLowerCase();
    const majuscule = t => t.charAt(0).toUpperCase() + t.slice(1);
    const sansCarte = t => majuscule(t.replace(/^Carte : /, ""));
    const fini = a => a.total > 0 && a.ratio >= 0.999;
    const pourcent = r => Math.round(Math.min(1, r) * 100) + "%";
    const trait = r => LS.el("span", { class: "trait", "aria-hidden": "true" }, [LS.el("i", { style: "--p:" + pourcent(r) })]);

    const domaines = LS.parcours.map(d => {
      const n = LS.niveau(d.id);
      const etapes = d.etapes.map(e => Object.assign({ domaine: d.id }, e, { a: avancement(e, d.id), portee: LS.pourNiveau(e.niv, n) }));
      const ratio = etapes.reduce((s, e) => s + e.a.ratio, 0) / etapes.length;
      // Étape en cours : la première non terminée qui est à la portée de l'élève (sinon la première non terminée).
      const courante = etapes.find(e => !fini(e.a) && e.portee) || etapes.find(e => !fini(e.a)) || null;
      const nivMin = Math.min(...etapes.map(e => (Array.isArray(e.niv) ? e.niv[0] : e.niv) || 1));
      return { d, n, etapes, ratio, faites: etapes.filter(e => fini(e.a)).length, courante, plusTard: !etapes.some(e => e.portee), nivMin };
    });
    const parId = Object.fromEntries(domaines.map(x => [x.d.id, x]));

    /* ---------- La date, en haut de la page ---------- */
    try { document.getElementById("date").textContent = majuscule(new Date().toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long" })); } catch (e) { /* ancien navigateur */ }

    /* ---------- On reprend ---------- */
    const der = LS.lire("derniere", null);
    let cible = null, raison = "";
    if (der) {
      const dom = domaines.find(x => x.etapes.some(e => e.type === der.type && e.id === der.id));
      const e = dom && dom.etapes.find(x => x.type === der.type && x.id === der.id);
      if (e && !fini(e.a) && e.portee) { cible = e; raison = "On reprend :"; }
      else if (dom && dom.courante) { cible = dom.courante; raison = "Étape suivante :"; }
    }
    if (!cible) { const dom = domaines.find(x => x.d.id === "electricite" && x.courante) || domaines.find(x => x.courante); if (dom) { cible = dom.courante; raison = der ? "Prochaine étape :" : "Pour commencer :"; } }
    const rep = document.getElementById("reprendre");
    const sansProfil = !LS.profil().niveau;
    const ecranChoix = sansProfil || location.hash === "#niveau";
    if (ecranChoix) choixNiveau();
    else if (cible) {
      const numero = cible.type === "tp" ? parId[cible.domaine].etapes.filter(e => e.type === "tp").indexOf(cible) + 1 : 0;
      const ou = (cible.type === "carte" ? "Carte mentale" : "TP " + numero) + " de l'atelier " + LS.nomDomaine(cible.domaine) + "." +
        (cible.a.total ? " Tu as fait " + cible.a.faits + " sur " + cible.a.total + "." : "");
      rep.className = "reprendre";
      rep.append(
        LS.el("div", {}, [
          LS.el("h1", { id: "titre-reprendre" }, [LS.el("span", { class: "quand", text: raison }), document.createTextNode(sansCarte(cible.titre))]),
          LS.el("p", { text: ou })]),
        LS.el("a", { class: "btn-reprendre", href: LS.etapeHref(cible) }, [LS.el("span", { text: cible.a.faits ? "Continuer" : "Commencer" }), LS.el("span", { html: LS.icone("suivant", 24) })]));
    } else rep.append(LS.el("h1", { id: "titre-reprendre", text: "Tout est terminé. Bravo !" }));

    /* ---------- Choix du niveau, ou petit test de placement, sur la page ---------- */
    function choixNiveau() {
      const p = LS.profil();
      rep.className = "choix-niveau";
      rep.innerHTML = "";
      rep.append(
        LS.el("h1", { id: "titre-reprendre", text: p.niveau ? "Change de niveau" : "Bonjour ! Choisis ton niveau" }),
        LS.el("p", { text: p.niveau ? "Ton niveau actuel : " + nomNiveau(p.niveau) + "." : "On te proposera les bonnes activités. Tu pourras en changer quand tu veux." }),
        LS.el("div", { class: "touches-niveau" }, LS.NIVEAUX.map(x => LS.el("button", { class: "touche-niveau" + (p.niveau === x.n ? " actif" : ""), "aria-pressed": p.niveau === x.n ? "true" : "false", onclick: () => valider(x.n) }, [
          LS.el("strong", { text: x.nom }), LS.el("span", { text: x.ecole }), LS.el("small", { text: x.age })]))),
        LS.el("button", { class: "btn secondaire touche-test", onclick: test, text: "Je ne sais pas : faire le petit test (8 questions)" }));
    }
    function valider(n) {
      LS.choisirNiveau(n);
      try { history.replaceState(null, "", "#tableau"); } catch (e) { /* cadre */ }
      location.reload();
    }
    function test() {
      const Q = LS.TEST_PLACEMENT, reps = {};
      let niv = 1, k = 0;
      const suivante = () => {
        const qs = Q.map((q, i) => i).filter(i => Q[i].niv === niv);
        if (k >= qs.length) {
          const justes = qs.filter(i => reps[i] === Q[i].bonne).length;
          if (justes === 0 || niv === 4) return fin();
          niv++; k = 0; return suivante();
        }
        const i = qs[k], q = Q[i];
        rep.innerHTML = "";
        rep.append(LS.el("p", { class: "test-avance", text: "Petit test, question " + (Object.keys(reps).length + 1) }),
          LS.el("h1", { id: "titre-reprendre", class: "question-test", text: q.q }),
          LS.el("div", { class: "reponses-test" }, q.choix.map((c, j) => LS.el("button", { class: "touche-niveau", text: c, onclick: () => { reps[i] = j; k++; suivante(); } }))));
        const b = rep.querySelector(".touche-niveau"); if (b) b.focus();
      };
      const fin = () => {
        const n = LS.niveauDuTest(reps);
        rep.innerHTML = "";
        rep.append(LS.el("h1", { id: "titre-reprendre" }, [document.createTextNode("Merci ! On te propose : "), LS.el("span", { class: "surligne", text: LS.infoNiveau(n).nom })]),
          LS.el("p", { text: LS.infoNiveau(n).ecole + ". Tu pourras en changer quand tu veux." }),
          LS.el("div", { class: "touches-niveau deux" }, [LS.el("button", { class: "touche-niveau actif", onclick: () => valider(n) }, [LS.el("strong", { text: "C'est parti" })]),
            LS.el("button", { class: "touche-niveau", onclick: choixNiveau }, [LS.el("strong", { text: "Choisir moi-même" })])]));
      };
      suivante();
    }

    /* ---------- Ma journée : points du jour, série, rang, mot du professeur ---------- */
    const etat = J.etat();
    const avDom = Object.fromEntries(domaines.map(x => [x.d.id, x.ratio]));
    const brevets = J.brevets(avDom), obtenus = brevets.filter(b => b.ok);
    const jr = document.getElementById("journee");
    if (sansProfil) jr.hidden = true;
    else {
      const jours = LS.lire("jours", {}), semaine = LS.el("span", { class: "semaine", role: "img", "aria-label": "Jours actifs sur les 7 derniers jours" });
      let actifs7 = 0;
      for (let i = 6; i >= 0; i--) { const d = new Date(); d.setDate(d.getDate() - i); const on = (jours[J.jourISO(d)] || 0) > 0; if (on) actifs7++; semaine.append(LS.el("i", { class: (on ? "on" : "") + (i === 0 ? " auj" : "") })); }
      const atteint = etat.jour >= etat.objectifJour;
      jr.append(
        LS.el("div", {}, [LS.el("span", { class: "chiffre" }, [document.createTextNode(String(etat.jour)), LS.el("small", { text: " / " + etat.objectifJour + " points aujourd'hui" })]),
          LS.el("span", { class: "jauge-jour", role: "img", "aria-label": etat.jour + " points sur " + etat.objectifJour }, [LS.el("i", { style: "--p:" + pourcent(etat.jour / etat.objectifJour) })]),
          LS.el("span", { class: "legende" }, [LS.el("small", { text: atteint ? "Objectif du jour atteint." : "Notion 10, objectif 25, question 10." })])]),
        LS.el("div", {}, [LS.el("span", { class: "chiffre" }, [document.createTextNode(String(etat.serie)), LS.el("small", { text: etat.serie > 1 ? " jours de suite" : " jour de suite" })]), semaine]),
        LS.el("div", {}, [LS.el("span", { class: "chiffre" }, [document.createTextNode("Rang " + etat.niveau.n), LS.el("small", { text: " " + etat.niveau.titre })]),
          LS.el("span", { class: "legende" }, [LS.el("small", { text: (etat.niveau.pour - etat.niveau.dans) + " points avant le rang " + (etat.niveau.n + 1) + "." })])]),
        LS.el("div", {}, [LS.el("span", { class: "chiffre" }, [document.createTextNode(String(obtenus.length)), LS.el("small", { text: " brevet" + (obtenus.length > 1 ? "s" : "") + " sur " + brevets.length })]),
          obtenus.length ? LS.el("span", {}, [LS.el("span", { class: "tampon-mini", text: obtenus[obtenus.length - 1].nom })]) : LS.el("a", { href: "#brevets", class: "legende", text: "Voir les brevets" })]));
      // Le mot du professeur, à l'encre rouge.
      const mot = atteint ? "Objectif du jour atteint. Très bon travail !" : etat.serie >= 3 ? etat.serie + " jours de suite : continue comme ça !" :
        etat.points === 0 ? "Un petit pas chaque jour suffit. À toi de jouer !" : actifs7 >= 2 ? "Bon travail cette semaine, continue !" : "Content de te revoir. On reprend doucement.";
      jr.append(LS.el("p", { class: "mot-prof", text: mot }));
    }

    /* ---------- Sommaire : un atelier par ligne, numéroté dans la marge ---------- */
    const sommaire = document.getElementById("sommaire"), zoneLecons = document.getElementById("lecons");
    domaines.forEach((x, k) => {
      const desc = x.plusTard ? "Pour plus tard (" + nomNiveau(x.nivMin) + ")" : x.d.desc;
      sommaire.append(LS.el("li", { class: x.plusTard ? "loin" : "" }, [LS.el("button", { class: "atelier" + (x.ratio >= 0.999 ? " termine" : "") + (x.plusTard ? " plus-tard" : ""), id: "atelier-" + x.d.id, "aria-pressed": "false",
        "aria-label": x.d.titre + ", " + x.faites + " étapes terminées sur " + x.etapes.length + (x.plusTard ? ", pour plus tard" : ""), onclick: () => choisir(x.d.id, true) }, [
        LS.el("span", { class: "num", "aria-hidden": "true", text: (k + 1) + "." }),
        LS.pictoAtelier(x.d.id),
        LS.el("span", { class: "atelier-texte" }, [LS.el("span", { class: "atelier-nom", text: x.d.titre }), LS.el("small", { text: desc })]),
        LS.el("span", { class: "atelier-prog" }, [LS.el("span", { text: x.faites + "/" + x.etapes.length }), trait(x.ratio)])
      ])]));
    });

    // Au téléphone, l'accueil reste court : les éléments « loin » sont repliés derrière un bouton.
    function voirPlus(liste, texte) {
      const n = liste.querySelectorAll(":scope > .loin").length;
      liste.classList.add("repliable");
      if (!n) return;
      const b = LS.el("button", { class: "btn petit secondaire voir-plus", type: "button", "aria-expanded": "false", text: texte.replace("{n}", n),
        onclick: () => { liste.classList.add("ouvert"); b.remove(); } });
      liste.after(b);
    }
    voirPlus(sommaire, "Voir les {n} ateliers pour plus tard");

    function choisir(id, defiler) {
      const x = parId[id]; if (!x) return;
      sommaire.querySelectorAll(".atelier").forEach(t => t.setAttribute("aria-pressed", t.id === "atelier-" + id ? "true" : "false"));
      zoneLecons.innerHTML = "";
      const liste = LS.el("ol", { class: "liste-lecons" });
      let nTP = 0;
      x.etapes.forEach(e => {
        const f = fini(e.a), cour = (cible && cible.domaine === id ? cible.id === e.id && cible.type === e.type : x.courante === e);
        if (e.type === "tp") nTP++;
        liste.append(LS.el("li", { class: "lecon" + (f ? " fait" : "") + (cour ? " courant" : "") + (e.portee ? "" : " plus-tard") + (e.type === "carte" ? " carte" : " tp") }, [
          LS.el("span", { class: "case", "aria-hidden": "true", html: f ? LS.icone("coche") : e.type === "carte" ? "" : String(nTP) }),
          LS.el("div", { class: "lecon-texte" }, [
            LS.el("a", { href: LS.etapeHref(e), class: "lecon-lien", text: sansCarte(e.titre) }),
            LS.el("span", { class: "lecon-info" }, [cour ? LS.el("span", { class: "ici", text: "Tu en es là" }) : null,
              e.portee ? null : LS.el("span", { class: "plus-tard-etiquette", text: "Pour plus tard (" + nomNiveau(e.niv) + ")" }),
              LS.el("span", { text: (e.type === "carte" ? "Carte mentale" : "TP " + nTP) + (f ? ", terminé" + (e.type === "carte" ? "e" : "") : e.a.total ? ", " + e.a.faits + " sur " + e.a.total : "") + (e.desc ? ". " + e.desc : "") })])
          ])
        ]));
      });
      const items = [...liste.children], iCour = Math.max(0, items.findIndex(li => li.classList.contains("courant")));
      items.forEach((li, k) => { if (k < iCour - 1 || k > iCour + 3) li.classList.add("loin"); });
      zoneLecons.append(
        LS.el("div", { class: "lecons-tete" }, [LS.pictoAtelier(id, "mini"), LS.el("h3", { text: x.d.titre }), LS.el("span", { class: "compte", text: x.faites + " / " + x.etapes.length })]),
        LS.el("label", { class: "niveau-atelier" }, [LS.el("span", { text: "Niveau pour cet atelier" }),
          LS.el("select", { id: "niveau-atelier", onchange: ev => { LS.choisirNiveau(+ev.target.value || null, id); location.reload(); } },
            [LS.el("option", { value: "", text: "Comme mon profil (" + nomNiveau(LS.niveau()) + ")" })].concat(LS.NIVEAUX.map(v => {
              const o = LS.el("option", { value: v.n, text: v.nom }); if ((LS.profil().parAtelier || {})[id] === v.n) o.selected = true; return o; })))]),
        liste);
      voirPlus(liste, "Voir toutes les leçons ({n} de plus)");
      if (defiler) {
        // Sur grand écran, les leçons sont déjà à côté du sommaire : on ne fait défiler qu'au téléphone.
        if (!matchMedia("(min-width: 1000px)").matches) zoneLecons.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start" });
        try { history.replaceState(null, "", "#" + id); } catch (e) { /* cadre */ }
      }
    }
    const h = location.hash.slice(1);
    choisir(parId[h] ? h : (cible ? cible.domaine : domaines[0].d.id), false);
    if (parId[h]) document.getElementById("ateliers").scrollIntoView();

    /* ---------- Brevets : des tampons ---------- */
    document.getElementById("brevets-resume").textContent = obtenus.length + " sur " + brevets.length;
    const gb = document.getElementById("grille-brevets");
    const vus = LS.lire("brevetsVus", {}), nouveaux = [];
    brevets.forEach(b => {
      if (b.ok && !vus[b.id]) { nouveaux.push(b); vus[b.id] = true; }
      const idDom = b.domaine ? b.id.replace(/^dom-/, "") : null;
      gb.append(LS.el("div", { class: "brevet" + (b.ok ? " obtenu" : "") + (b.domaine ? " domaine" : ""), title: b.desc }, [
        LS.el("span", { class: "tampon", "aria-hidden": "true" }, idDom ? [LS.el("span", { class: "picto", html: LS.icone("dom-" + idDom, 30) })] : [LS.el("span", { class: "code", text: b.code })]),
        LS.el("strong", { text: b.nom }),
        LS.el("small", { text: b.ok ? "Obtenu" : b.domaine ? "Termine l'atelier " + LS.nomDomaine(idDom) : b.desc })]));
    });
    let aVenir = 0;
    [...gb.children].forEach(el => { if (!el.classList.contains("obtenu") && ++aVenir > 3) el.classList.add("loin"); });
    voirPlus(gb, "Voir tous les brevets ({n} de plus)");
    LS.ecrire("brevetsVus", vus);
    nouveaux.slice(0, 3).forEach(b => LS.avis("Nouveau brevet : " + b.nom));
    if (location.hash === "#brevets") document.getElementById("brevets").scrollIntoView();

    /* ---------- Recherche ---------- */
    const index = [];
    domaines.forEach(x => x.etapes.forEach(e => index.push({ texte: e.titre + " " + (e.desc || ""), titre: sansCarte(e.titre), sous: (e.type === "carte" ? "Carte, " : "TP, ") + x.d.titre, href: LS.etapeHref(e) })));
    LS.parcours.forEach(d => d.etapes.filter(e => e.type === "carte" && LS.cartes[e.id]).forEach(e => {
      LS.noeudsCarte(LS.cartes[e.id]).filter(n => n._niveau > 0).forEach(n => index.push({ texte: n.t + " " + (n.d || ""), titre: n.t, sous: "Notion, " + LS.cartes[e.id].titre, href: "carte.html?id=" + e.id + "&n=" + LS.slug(n.t) }));
    }));
    const norm = t => String(t).normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
    index.forEach(x => { x.n = norm(x.texte); x.nt = norm(x.titre); });
    const res = document.getElementById("resultats"), champ = document.getElementById("recherche");
    const chercher = () => {
      const q = norm(champ.value.trim()); res.innerHTML = "";
      if (q.length < 2) { res.append(LS.el("li", { class: "vide", text: index.length + " notions et étapes. Tape au moins 2 lettres." })); return; }
      const t = index.filter(x => x.n.includes(q)).sort((a, b) => (b.nt.includes(q) - a.nt.includes(q))).slice(0, 30);
      if (!t.length) res.append(LS.el("li", { class: "vide", text: "Rien trouvé pour « " + champ.value + " »." }));
      t.forEach(x => res.append(LS.el("li", {}, [LS.el("a", { href: x.href, text: x.titre }), LS.el("span", { class: "desc", text: x.sous })])));
    };
    champ.addEventListener("input", chercher); chercher();

    document.getElementById("effacer").addEventListener("click", ev => {
      LS.confirmer(ev.currentTarget, () => { ["compris", "tp", "gains", "jours", "brevetsVus"].forEach(k => LS.ecrire(k, {})); LS.ecrire("derniere", null); location.reload(); }, "Tout effacer ? Clique encore");
    });
  })();
  </script>
</body>
</html>
